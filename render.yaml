services:
  - type: web
    name: oncology-mvp
    runtime: node
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: ONCO_DB_PROVIDER
        value: supabase
      - key: ONCO_DB_STRICT_SUPABASE
        value: "true"
      - key: SUPABASE_BATCH_SIZE
        value: "500"
      - key: SUPABASE_PROJECT_REF
        value: qkcukpbqyjghroksxuvg
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://qkcukpbqyjghroksxuvg.supabase.co
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
